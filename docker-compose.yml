services:
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /home/servicos/docker-file/nextcloud/config:/config
      - /home/servicos/docker-file/nextcloud/data:/data
      - ./:/config/www/nextcloud/apps/artcraft
    ports:
      - 1443:443
      - 1088:80
    restart: unless-stopped
    networks:
      - net_nextcloud

networks:
  net_nextcloud:
    driver: bridge
